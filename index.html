<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pico Poetry · petiscos de poesia</title>
<meta name="description" content="99 petiscos de poesia de Peter Mac. Sorteie uma, escolha as cores e compartilhe.">
<meta name="theme-color" content="#ff77a8">
<meta property="og:title" content="Pico Poetry · petiscos de poesia">
<meta property="og:description" content="99 petiscos de poesia de Peter Mac. Sorteie uma e compartilhe.">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top"><span>PICO POETRY</span><span id="num">000/099</span></header>
  <main class="stage">
    <section class="poem" id="poem" aria-live="polite">
      <h1 id="title" class="chip"></h1>
      <div id="body" class="verse"></div>
      <p class="by">— Peter Mac</p>
    </section>
    <aside id="index" class="index" aria-label="Índice" hidden>
      <div class="idx-head"><span>ÍNDICE</span><button class="x" id="closeIdx" aria-label="Fechar">✕</button></div>
      <input id="filter" type="search" placeholder="buscar título…" autocomplete="off" aria-label="Buscar título">
      <ol id="list"></ol>
    </aside>
  </main>
  <nav class="bar">
    <button class="btn y" id="btnIdx">ÍNDICE</button>
    <button class="btn k" id="btnRand">SORTEAR</button>
    <button class="btn g" id="btnShare">ENVIAR</button>
  </nav>
  <p class="foot">petiscos de poesia · picopoetry</p>
</div>

<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="Compartilhar">
  <div class="sheet-in">
    <div class="idx-head"><span>COMPARTILHAR</span><button class="x" id="closeSheet" aria-label="Fechar">✕</button></div>
    <canvas id="card" width="1080" height="1350"></canvas>
    <button class="btn y wide" id="toggleColors" aria-expanded="false">CORES ▾</button>
    <div id="colors" class="colors" hidden>
      <div class="presets" id="presets"></div>
      <div class="lbl">FUNDO</div><div class="sw" id="swBg"></div>
      <div class="lbl">TEXTO</div><div class="sw" id="swInk"></div>
    </div>
    <div class="row2">
      <button class="btn k" id="btnSave">SALVAR IMAGEM</button>
      <button class="btn g" id="btnSend">ENVIAR ↗</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>
</div>
<script src="poems.js"></script>
<script src="app.js"></script>
</body>
</html>
